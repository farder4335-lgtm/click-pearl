name: publish-jar
on:
  push:
    branches: [main]
    paths-ignore: ['releases/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - name: commit jar to releases/
        run: |
          mkdir -p releases
          rm -f releases/*.jar
          cp build/libs/click-pearl-*[0-9].jar releases/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases
          git commit -m "Add built jar" || exit 0
          git push
